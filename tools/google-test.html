<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiblioTech — Test Google Sign-In</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        width: 100%;
        font-family: monospace;
        font-size: 12px;
      }
      .warn {
        background: #fff3cd;
        border: 1px solid #ffc107;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      code {
        background: #f4f4f4;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>BiblioTech — obtenir un id_token</h1>

    <div class="warn">
      <strong>Important :</strong> ouvrez cette page via
      <code>http://localhost:5500</code> (pas en double-clic / pas
      <code>file://</code>).<br />
      Commande : <code>npx serve tools -p 5500</code> depuis la racine du
      projet.
    </div>

    <p>Origine actuelle : <strong id="origin"></strong></p>

    <div
      id="g_id_onload"
      data-client_id="662712504763-cqf0ftmfjm7ol21vlh93hj33rl7317l4.apps.googleusercontent.com"
      data-callback="onGoogleSignIn"
      data-auto_prompt="false"
      data-ux_mode="popup"
    ></div>

    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>

    <h2>id_token (copier dans Postman → POST /auth/google)</h2>
    <textarea id="token" rows="10" placeholder="Le token apparaît ici après connexion…"></textarea>

    <script>
      document.getElementById('origin').textContent = window.location.origin;

      function onGoogleSignIn(response) {
        document.getElementById('token').value = response.credential;
        console.log('id_token reçu, longueur:', response.credential.length);
      }
    </script>
  </body>
</html>
