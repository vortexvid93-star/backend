# Render Blueprint — BiblioTech API (backend/)
# Dashboard : New → Blueprint → connecter ce dépôt, branche final_projet
services:
  - type: web
    name: bibliotech-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npm run db:migrate:deploy && npm run db:constraints
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CRON_ENABLED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: pawapay
      - key: PAYMENT_PUBLIC_BASE_URL
        sync: false
      - key: PAWAPAY_MODE
        value: sandbox
      - key: PAWAPAY_API_TOKEN
        sync: false
      - key: PAWAPAY_PUBLIC_BASE_URL
        sync: false
      - key: PAWAPAY_DEFAULT_PROVIDER
        value: MTN_MOMO_COG
      - key: PAWAPAY_DEFAULT_CURRENCY
        value: XAF
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
