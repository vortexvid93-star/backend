# Développement local — NestJS + PostgreSQL
# Usage : docker compose up --build
# Variables : fichier .env à la racine (+ override DATABASE_URL vers le service postgres)

services:
  postgres:
    image: postgres:16-alpine
    container_name: bibliotech-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bibliotech}
    ports:
      # Port hôte 5433 par défaut — évite le conflit avec PostgreSQL local (5432)
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bibliotech}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: bibliotech-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # localhost dans .env pointe vers le conteneur app — on cible le service postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bibliotech}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
